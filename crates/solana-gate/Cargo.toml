[package]
name = "solana-gate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana bridge gate program — the on-chain counterpart of Gate.sol"

# Built with the Solana toolchain, NOT the host workspace:
#     cargo build-sbf --manifest-path crates/solana-gate/Cargo.toml
# (its solana-program / spl-token deps only compile for the BPF/SBF target). The
# protocol logic here is the tested `bridge-solana` crate's logic, reimplemented
# against Solana syscalls (keccak, secp256k1_recover) and SPL CPIs.

[lib]
crate-type = ["cdylib", "lib"]

# Pinned to the local test node's runtime (Solana 1.18.26 / platform-tools v1.41).
[dependencies]
solana-program = "=1.18.26"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
borsh = { version = "1", features = ["derive"] }
# Decode the BPF-loader `ProgramData` account (init upgrade-authority check).
bincode = "1"
thiserror = "1"

[features]
no-entrypoint = []

# Account-level tests. `solana-program-test` runs the program NATIVELY via
# `processor!(process_instruction)` — no SBF toolchain required — inside a real
# test bank, so rent, lamports, account ownership, PDA derivation and CPI all
# behave as on-chain. This is what actually exercises the handlers; the
# `c1_tests` module only covers the pure authorization predicates.
[dev-dependencies]
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
