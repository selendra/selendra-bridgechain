# Indexer — records bridge history and marks stranded transfers refund-eligible
# (finding H4: this is the component compose was previously missing, so the
# validators' refund candidate list never became populated). Writes to the same
# Postgres the sig-store and graphql-api use. DATABASE_URL (compose env) wins over
# the value here via `resolved_database_url()`.
database_url = "postgres://bridge:bridge@postgres:5432/bridge"

# A transfer unclaimed for this long is eligible for the two-phase refund. Short
# for local bring-up; use hours in production (must exceed real claim latency).
refund_timeout_secs = 60
sweep_interval_secs = 5

[[chains]]
chain_id = 1337
rpc = "http://anvil-src:8545"
gate = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
start_block = 0
# anvil is instant-final; on a real chain set a finality buffer (findings H1/M-7).
block_confirmation = 0
allow_zero_confirmation = true   # NEVER set this on a real chain
poll_interval_ms = 500
max_block_range = 1000

[[chains]]
chain_id = 1338
rpc = "http://anvil-dst:8545"
gate = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
start_block = 0
block_confirmation = 0
allow_zero_confirmation = true   # NEVER set this on a real chain
poll_interval_ms = 500
max_block_range = 1000
