# Serve the built SPA and proxy the backend calls to graphql-api same-origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback — unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # GraphQL + health go to the API service on the compose network.
    location /graphql {
        proxy_pass http://graphql-api:8088/graphql;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location /health {
        proxy_pass http://graphql-api:8088/health;
    }
}
