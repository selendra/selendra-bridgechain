# GENERATED by scripts/bridge-from-json.sh --compose from testnet5.bridge.local.json
# Regenerate after any config change; hand edits are overwritten.
#
#   cp .env.example .env && edit it   (tokens + Postgres password)
#   docker compose up -d --build
#
# The configs in ./configs are generated too, and they carry the validator
# and keeper PRIVATE KEYS — treat this directory as secret material.

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: bridge
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 3s
      timeout: 3s
      retries: 30

  sig-store:
    build: { context: ../.., dockerfile: Dockerfile }
    <<: *restart
    command: ["sig-store", "--bind", "0.0.0.0:8080"]
    environment:
      DATABASE_URL: "postgres://bridge:${POSTGRES_PASSWORD}@postgres:5432/bridge"
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN}"
      SIG_STORE_KEEPER_TOKEN: "${SIG_STORE_KEEPER_TOKEN:?set SIG_STORE_KEEPER_TOKEN}"
      SIG_STORE_READER_TOKEN: "${SIG_STORE_READER_TOKEN:?set SIG_STORE_READER_TOKEN}"
      SIG_STORE_ADMIN_TOKEN: "${SIG_STORE_ADMIN_TOKEN:?set SIG_STORE_ADMIN_TOKEN}"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  validator-val-1:
    build: { context: ../.., dockerfile: Dockerfile }
    <<: *restart
    command: ["validator", "/configs/validator-val-1.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN}"
    volumes:
      - ./configs:/configs:ro
      - validator-val-1-state:/data
    depends_on:
      sig-store: { condition: service_healthy }

  validator-val-2:
    build: { context: ../.., dockerfile: Dockerfile }
    <<: *restart
    command: ["validator", "/configs/validator-val-2.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN}"
    volumes:
      - ./configs:/configs:ro
      - validator-val-2-state:/data
    depends_on:
      sig-store: { condition: service_healthy }

  keeper-keeper-1:
    build: { context: ../.., dockerfile: Dockerfile }
    <<: *restart
    command: ["keeper", "/configs/keeper-keeper-1.toml"]
    environment:
      SIG_STORE_KEEPER_TOKEN: "${SIG_STORE_KEEPER_TOKEN:?set SIG_STORE_KEEPER_TOKEN}"
    volumes: ["./configs:/configs:ro"]
    depends_on:
      sig-store: { condition: service_healthy }

  solana-relayer-sol-1:
    build: { context: ../.., dockerfile: docker/Dockerfile.relayer }
    <<: *restart
    command: ["solana-relayer", "/configs/solana-relayer-sol-1.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN}"
    volumes:
      - ./configs:/configs:ro
      - ./keys:/keys:ro
      - solana-sol-1-state:/data
    depends_on:
      sig-store: { condition: service_healthy }

  solana-relayer-sol-2:
    build: { context: ../.., dockerfile: docker/Dockerfile.relayer }
    <<: *restart
    command: ["solana-relayer", "/configs/solana-relayer-sol-2.toml"]
    environment:
      SIG_STORE_VALIDATOR_TOKEN: "${SIG_STORE_VALIDATOR_TOKEN:?set SIG_STORE_VALIDATOR_TOKEN}"
    volumes:
      - ./configs:/configs:ro
      - ./keys:/keys:ro
      - solana-sol-2-state:/data
    depends_on:
      sig-store: { condition: service_healthy }

  indexer:
    build: { context: ../.., dockerfile: Dockerfile }
    <<: *restart
    command: ["indexer", "/configs/indexer.toml"]
    environment:
      DATABASE_URL: "postgres://bridge:${POSTGRES_PASSWORD}@postgres:5432/bridge"
    volumes: ["./configs:/configs:ro"]
    depends_on:
      sig-store: { condition: service_healthy }
      postgres: { condition: service_healthy }

  graphql-api:
    build: { context: ../.., dockerfile: Dockerfile }
    <<: *restart
    command:
      - "graphql-api"
      - "--bind"
      - "0.0.0.0:8088"
      - "--store-url"
      - "http://sig-store:8080"
      - "--threshold"
      - "2"
      - "--chains-file"
      - "/configs/chains.json"
      - "--allow-mutations"
      - "--gate"
      - "11155111=https://eth-sepolia.g.alchemy.com/v2/alch_0yxW5Nx78Hp-2dZ-iJBSq,0x6170A28F84394Ef720C0C51d8E2EC646c01E5881"
      - "--gate"
      - "560048=https://eth-hoodi.g.alchemy.com/v2/alch_0yxW5Nx78Hp-2dZ-iJBSq,0x09aC605DbA3690d6CC02c6ceA3E00C0a54F695Ed"
      - "--gate"
      - "10143=https://testnet-rpc.monad.xyz/,0x440d9207D79F03111aC81305d6660EAdf0443Dc4"
      - "--gate"
      - "46630=https://robinhood-sepolia-rpc.publicnode.com,0x1A0CD51161858423a9BB5ed668F24664b21eAEcb"
      - "--gate"
      - "7565164=https://solana-devnet.g.alchemy.com/v2/alch_0yxW5Nx78Hp-2dZ-iJBSq,HvGQTWChe6bMpSYGNavDhGcG8YrJkubJQCDmBrxNR133"
      - "--swap"
      - "11155111=https://eth-sepolia.g.alchemy.com/v2/alch_0yxW5Nx78Hp-2dZ-iJBSq,0xB1f47Baea9ddCf3aDF61C4bd0c3b2EB788685164,11581995,10"
      - "--swap"
      - "560048=https://eth-hoodi.g.alchemy.com/v2/alch_0yxW5Nx78Hp-2dZ-iJBSq,0x8d8A870F1CaAFc10100ecbeF7253856d372F84C1,3507622,10"
      - "--swap"
      - "10143=https://testnet-rpc.monad.xyz/,0xC211D0914A28bD9410113818FA35Bf42f7DEf06a,57523439,100"
      - "--swap"
      - "46630=https://robinhood-sepolia-rpc.publicnode.com,0xC1a35cD2514004195eE594FCab03BFd2cCa591d9,108541684,500"
      - "--swap"
      - "7565164=https://solana-devnet.g.alchemy.com/v2/alch_0yxW5Nx78Hp-2dZ-iJBSq,E28r29Hyky3UqVBcdSvFk6qNedbRN8X2z4R8hYGDUk88"
    environment:
      SIG_STORE_READER_TOKEN: "${SIG_STORE_READER_TOKEN:?set SIG_STORE_READER_TOKEN}"
      GRAPHQL_MAX_BLOCK_RANGE: "10"
    volumes: ["./configs:/configs:ro"]
    depends_on:
      sig-store: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: { context: ../.., dockerfile: docker/Dockerfile.frontend }
    <<: *restart
    ports: ["5173:8080"]
    depends_on:
      graphql-api: { condition: service_healthy }

volumes:
  pgdata:
  validator-val-1-state:
  validator-val-2-state:
  solana-sol-1-state:
  solana-sol-2-state:
