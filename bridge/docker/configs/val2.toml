# Validator #2 — anvil account [2].
[source]
chain_id = 1337
rpcs = ["http://anvil-src:8545"]
gate = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
start_block = 0
block_confirmation = 0
allow_zero_confirmation = true   # anvil has instant finality; NEVER set on a real chain
poll_interval_ms = 500
max_block_range = 1000
state_file = "/data/val2-state.json"

[signer]
private_key = "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"

[store]
url = "http://sig-store:8080"

# Refund attestation loop. Without this block the validator never votes on
# whether a stranded transfer may be cancelled/refunded — a deliberate default,
# since a node that cannot read the destination chain must not have an opinion
# on whether a transfer was delivered.
[refund]
timeout_secs = 60          # short, for local bring-up; use hours in production
poll_interval_ms = 2000
block_confirmation = 0
allow_zero_confirmation = true   # anvil has instant finality; NEVER set on a real chain

[[refund.destinations]]
chain_id = 1338
rpcs = ["http://anvil-dst:8545"]
gate = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
