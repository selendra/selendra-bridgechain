[package]
name = "sig-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `abi` enables the store's trust-boundary validation (id<->params binding +
# signature authentication) — the sig-store is unauthenticated, so it must verify.
bridge-core = { workspace = true, features = ["abi"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
