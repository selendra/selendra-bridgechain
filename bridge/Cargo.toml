[workspace]
resolver = "2"
members = [
    "crates/bridge-core",
    "crates/validator",
    "crates/keeper",
    "crates/sig-store",
    "crates/graphql-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }

alloy = { version = "1.0", features = [
    "full",
    "signer-local",
    "signer-keystore",
    "node-bindings",
] }
alloy-primitives = { version = "1.0", features = ["serde"] }
alloy-sol-types = "1.0"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
