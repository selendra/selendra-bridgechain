[package]
name = "inject-msg"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone helper: signs and submits a BridgeOutbound::submit extrinsic to a
# local bridgechain --dev node. Used only by the relayer's e2e harness; lives
# outside the workspace so the workspace toolchain doesn't pull subxt's deps.

[workspace]

[dependencies]
subxt = "0.50.1"
subxt-signer = { version = "0.50.1", features = ["sr25519"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
