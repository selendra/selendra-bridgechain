[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = false

# Snowbridge's BeefyClient.sol uses inline assembly + memory-safe-assembly
# comments and several compact-encoding utilities; these are normal and
# match the upstream config.
ignored_error_codes = [
    2394,  # tstore
    2424,  # natspec memory-safe-assembly
]

# Production: via_ir + heavy optimization for deployment artifacts.
[profile.production]
via_ir = true
optimizer_runs = 20000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
